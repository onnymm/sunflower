[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sunflower"
version = "0.1.0"
authors = [
    {name = "Pável Hernández Reza", email = "phr2807@gmail.com" }]
description = "Gestor de conexión a bases de datos altamente personalizable."
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
        "bcrypt==4.3.0",
        "pandas==2.2.3",
        "passlib==1.7.4",
        "psycopg2==2.9.10",
        "pydantic==2.11.5",
        "PyJWT==2.10.1",
        "SQLAlchemy==2.0.41",
]

[tool.setuptools]
package-dir = { "" = "src" }
